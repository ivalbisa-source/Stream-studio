name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Direct Instant TikTok Launcher
      run: |
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/assets

        mv -f index.html app/src/main/assets/ 2>/dev/null || true
        mv -f *.html *.js *.css app/src/main/assets/ 2>/dev/null || true

        cat << 'EOF' > app/src/main/res/xml/file_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-path name="external_files" path="."/>
            <cache-path name="cache_files" path="."/>
        </paths>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <!-- Izin mengenali aplikasi TikTok biasa & TikTok Lite -->
            <queries>
                <package android:name="com.zhiliaoapp.musically" />
                <package android:name="com.ss.android.ugc.trill" />
            </queries>

            <application
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:largeHeap="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="StreamStudio"
                android:roundIcon="@android:drawable/sym_def_app_icon"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:hardwareAccelerated="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="com.stream.studio.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>

            </application>
        </manifest>
        EOF

        # MainActivity dengan Direct Launch instan ke TikTok
        cat << 'EOF' > app/src/main/java/com/stream/studio/MainActivity.kt
        package com.stream.studio

        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.media.projection.MediaProjectionManager
        import android.net.Uri
        import android.os.Bundle
        import android.view.View
        import android.view.ViewGroup
        import android.view.WindowManager
        import android.webkit.JavascriptInterface
        import android.webkit.ValueCallback
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.FrameLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {

            private lateinit var webView: WebView
            private var customView: View? = null
            private var customViewCallback: WebChromeClient.CustomViewCallback? = null
            private lateinit var fullscreenContainer: FrameLayout

            private var filePathCallback: ValueCallback<Array<Uri>>? = null
            private val REQUEST_SCREEN_CAPTURE = 1001
            private val REQUEST_FILE_CHOOSER = 1002

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                window.setFlags(
                    WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                    WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                )

                val rootLayout = FrameLayout(this)
                webView = WebView(this)
                fullscreenContainer = FrameLayout(this).apply {
                    visibility = View.GONE
                }

                rootLayout.addView(webView, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                rootLayout.addView(fullscreenContainer, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                setContentView(rootLayout)

                val settings: WebSettings = webView.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                settings.mediaPlaybackRequiresUserGesture = false
                settings.setRenderPriority(WebSettings.RenderPriority.HIGH)
                settings.cacheMode = WebSettings.LOAD_NO_CACHE

                webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                webView.webViewClient = WebViewClient()

                webView.webChromeClient = object : WebChromeClient() {
                    override fun onShowFileChooser(
                        view: WebView?,
                        filePathCallback: ValueCallback<Array<Uri>>?,
                        fileChooserParams: FileChooserParams?
                    ): Boolean {
                        this@MainActivity.filePathCallback?.onReceiveValue(null)
                        this@MainActivity.filePathCallback = filePathCallback

                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "*/*"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        try {
                            startActivityForResult(Intent.createChooser(intent, "Pilih Media"), REQUEST_FILE_CHOOSER)
                        } catch (e: Exception) {
                            this@MainActivity.filePathCallback = null
                            return false
                        }
                        return true
                    }

                    override fun onShowCustomView(view: View?, callback: CustomViewCallback?) {
                        if (customView != null) {
                            onHideCustomView()
                            return
                        }
                        customView = view
                        customViewCallback = callback
                        fullscreenContainer.addView(view)
                        fullscreenContainer.visibility = View.VISIBLE
                        webView.visibility = View.GONE
                    }

                    override fun onHideCustomView() {
                        if (customView == null) return
                        fullscreenContainer.visibility = View.GONE
                        fullscreenContainer.removeView(customView)
                        customView = null
                        customViewCallback?.onCustomViewHidden()
                        webView.visibility = View.VISIBLE
                    }
                }

                val bridge = WebAppInterface(this)
                webView.addJavascriptInterface(bridge, "AndroidBridge")
                webView.addJavascriptInterface(bridge, "AndroidApp")

                webView.loadUrl("file:///android_asset/index.html")
            }

            fun requestScreenCapture() {
                val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_SCREEN_CAPTURE)
            }

            // Membuka TikTok secara instan tanpa dialog pemilih
            fun launchTikTokInstantly() {
                val tiktokPackages = listOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")
                var launched = false

                for (pkg in tiktokPackages) {
                    val intent = packageManager.getLaunchIntentForPackage(pkg)
                    if (intent != null) {
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                        startActivity(intent)
                        launched = true
                        break
                    }
                }

                if (!launched) {
                    // Fallback jika package TikTok tidak ditemukan
                    try {
                        val webIntent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.tiktok.com"))
                        webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                        startActivity(webIntent)
                    } catch (e: Exception) {
                        Toast.makeText(this, "Aplikasi TikTok tidak ditemukan", Toast.LENGTH_SHORT).show()
                    }
                }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)

                if (requestCode == REQUEST_SCREEN_CAPTURE) {
                    if (resultCode == Activity.RESULT_OK) {
                        Toast.makeText(this, "Transmisi Virtual Diaktifkan!", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "Izin transmisi dibatalkan", Toast.LENGTH_SHORT).show()
                    }
                }

                if (requestCode == REQUEST_FILE_CHOOSER) {
                    val resultUri = if (resultCode == Activity.RESULT_OK && data != null) {
                        data.data?.let { arrayOf(it) }
                    } else {
                        null
                    }
                    filePathCallback?.onReceiveValue(resultUri)
                    filePathCallback = null
                }
            }

            inner class WebAppInterface(private val activity: MainActivity) {
                @JavascriptInterface
                fun startCapture() {
                    activity.runOnUiThread { activity.requestScreenCapture() }
                }

                @JavascriptInterface
                fun shareVideo() {
                    activity.runOnUiThread { activity.launchTikTokInstantly() }
                }

                @JavascriptInterface
                fun triggerFullscreen() {
                    activity.runOnUiThread {
                        val decorView = activity.window.decorView
                        val uiOptions = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                or View.SYSTEM_UI_FLAG_FULLSCREEN
                                or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION)
                        decorView.systemUiVisibility = uiOptions
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.stream.studio'
            compileSdk 34

            defaultConfig {
                applicationId "com.stream.studio"
                minSdk 24
                targetSdk 34
                versionCode 6
                versionName "1.0.5"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-App
        path: "app/build/outputs/apk/debug/*.apk"
        
