name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Organize Folder Structure
      run: |
        mkdir -p app/src/main/java/com/stream/studio app/src/main/res/layout app/src/main/res/values
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f *.kt *.java app/src/main/java/com/stream/studio/ 2>/dev/null || true
        mv -f *activity*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv -f themes.xml strings.xml colors.xml app/src/main/res/values/ 2>/dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Android APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-App
        path: "**/build/outputs/apk/debug/*.apk"
        
