name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Project and Folder Structure
      run: |
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Buat settings.gradle standar
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        # Buat build.gradle root standar
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Pindahkan modul build.gradle ke folder app/
        if [ ! -f "app/build.gradle" ]; then
          for f in $(grep -l "com.android.application" *.gradle 2>/dev/null); do
            mv "$f" app/build.gradle
            break
          done
        fi

        # Pindahkan file resource dan kode ke tempat semestinya
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f *.kt *.java app/src/main/java/com/stream/studio/ 2>/dev/null || true
        mv -f *activity*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv -f themes.xml strings.xml colors.xml app/src/main/res/values/ 2>/dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-App
        path: "app/build/outputs/apk/debug/*.apk"
        
