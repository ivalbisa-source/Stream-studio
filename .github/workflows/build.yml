name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Project Structure & Clean Gradle Files
      run: |
        # Buat susunan folder resmi
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Pindahkan file ke lokasi modul app
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f *.kt *.java app/src/main/java/com/stream/studio/ 2>/dev/null || true
        mv -f *activity*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv -f themes.xml strings.xml colors.xml app/src/main/res/values/ 2>/dev/null || true

        # Pastikan baris pertama file Kotlin/Java memiliki deklarasi package yang cocok
        for f in app/src/main/java/com/stream/studio/*.kt app/src/main/java/com/stream/studio/*.java; do
          if [ -f "$f" ]; then
            sed -i 's/^package .*/package com.stream.studio/' "$f"
          fi
        done

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        # 2. build.gradle tingkat root
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        # 3. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # 4. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.stream.studio'
            compileSdk 34

            defaultConfig {
                applicationId "com.stream.studio"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-App
        path: "app/build/outputs/apk/debug/*.apk"
        
