name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Vanacam Web-Transmitter Architecture
      run: |
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/assets

        mv -f index.html app/src/main/assets/ 2>/dev/null || true
        mv -f *.html *.js *.css app/src/main/assets/ 2>/dev/null || true

        # 1. Strings Resource
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Stream Studio</string>
            <string name="notification_channel_name">Layanan Transmisi Layar</string>
            <string name="notification_text">Sesi transmisi video aktif di latar belakang</string>
        </resources>
        EOF

        # 2. AndroidManifest lengkap dengan Foreground Service Media Projection
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <queries>
                <package android:name="com.zhiliaoapp.musically" />
                <package android:name="com.ss.android.ugc.trill" />
            </queries>

            <application
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:largeHeap="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:hardwareAccelerated="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Service Foreground untuk transmisi MediaProjection tanpa terputus -->
                <service
                    android:name=".CaptureService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="mediaProjection" />

            </application>
        </manifest>
        EOF

        # 3. CaptureService.kt (Menjaga transmisi MediaProjection di latar belakang)
        cat << 'EOF' > app/src/main/java/com/stream/studio/CaptureService.kt
        package com.stream.studio

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.Service
        import android.content.Context
        import android.content.Intent
        import android.hardware.display.DisplayManager
        import android.hardware.display.VirtualDisplay
        import android.media.projection.MediaProjection
        import android.media.projection.MediaProjectionManager
        import android.os.Build
        import android.os.IBinder
        import androidx.core.app.NotificationCompat

        class CaptureService : Service() {

            private var mediaProjection: MediaProjection? = null
            private var virtualDisplay: VirtualDisplay? = null

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
                super.onCreate()
                createNotificationChannel()
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                if (intent == null) return START_NOT_STICKY

                val action = intent.action
                if (action == ACTION_STOP) {
                    stopCapture()
                    stopSelf()
                    return START_NOT_STICKY
                }

                val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, 0)
                val resultData = intent.getParcelableExtra<Intent>(EXTRA_RESULT_DATA)

                if (resultCode != 0 && resultData != null) {
                    startForeground(NOTIFICATION_ID, createNotification())
                    startCapture(resultCode, resultData)
                }

                return START_STICKY
            }

            private fun startCapture(resultCode: Int, resultData: Intent) {
                val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                mediaProjection = mpManager.getMediaProjection(resultCode, resultData)

                val metrics = resources.displayMetrics
                val width = metrics.widthPixels
                val height = metrics.heightPixels
                val dpi = metrics.densityDpi

                // Membuat VirtualDisplay untuk menyalurkan tampilan layar
                virtualDisplay = mediaProjection?.createVirtualDisplay(
                    "StreamStudioDisplay",
                    width,
                    height,
                    dpi,
                    DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                    null,
                    null,
                    null
                )
            }

            private fun stopCapture() {
                virtualDisplay?.release()
                virtualDisplay = null
                mediaProjection?.stop()
                mediaProjection = null
            }

            override fun onDestroy() {
                stopCapture()
                super.onDestroy()
            }

            private fun createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(
                        CHANNEL_ID,
                        getString(R.string.notification_channel_name),
                        NotificationManager.IMPORTANCE_LOW
                    )
                    val manager = getSystemService(NotificationManager::class.java)
                    manager?.createNotificationChannel(channel)
                }
            }

            private fun createNotification(): Notification {
                return NotificationCompat.Builder(this, CHANNEL_ID)
                    .setContentTitle(getString(R.string.app_name))
                    .setContentText(getString(R.string.notification_text))
                    .setSmallIcon(android.R.drawable.ic_menu_camera)
                    .setPriority(NotificationCompat.PRIORITY_LOW)
                    .build()
            }

            companion object {
                const val CHANNEL_ID = "stream_studio_capture_channel"
                const val NOTIFICATION_ID = 2024
                const val ACTION_START = "ACTION_START"
                const val ACTION_STOP = "ACTION_STOP"
                const val EXTRA_RESULT_CODE = "EXTRA_RESULT_CODE"
                const val EXTRA_RESULT_DATA = "EXTRA_RESULT_DATA"
            }
        }
        EOF

        # 4. MainActivity.kt (Sinkronisasi Web Interface dengan CaptureService)
        cat << 'EOF' > app/src/main/java/com/stream/studio/MainActivity.kt
        package com.stream.studio

        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.media.projection.MediaProjectionManager
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.view.View
        import android.view.WindowManager
        import android.webkit.JavascriptInterface
        import android.webkit.ValueCallback
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {

            private lateinit var webView: WebView
            private var filePathCallback: ValueCallback<Array<Uri>>? = null
            private val REQUEST_SCREEN_CAPTURE = 1001
            private val REQUEST_FILE_CHOOSER = 1002

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                webView = WebView(this)
                setContentView(webView)

                val settings: WebSettings = webView.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                settings.mediaPlaybackRequiresUserGesture = false
                settings.setRenderPriority(WebSettings.RenderPriority.HIGH)

                webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                webView.webViewClient = WebViewClient()

                webView.webChromeClient = object : WebChromeClient() {
                    override fun onShowFileChooser(
                        view: WebView?,
                        filePathCallback: ValueCallback<Array<Uri>>?,
                        fileChooserParams: FileChooserParams?
                    ): Boolean {
                        this@MainActivity.filePathCallback?.onReceiveValue(null)
                        this@MainActivity.filePathCallback = filePathCallback

                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "video/*"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        try {
                            startActivityForResult(Intent.createChooser(intent, "Pilih Video"), REQUEST_FILE_CHOOSER)
                        } catch (e: Exception) {
                            this@MainActivity.filePathCallback = null
                            return false
                        }
                        return true
                    }
                }

                val bridge = WebAppInterface(this)
                webView.addJavascriptInterface(bridge, "AndroidBridge")
                webView.addJavascriptInterface(bridge, "AndroidApp")

                webView.loadUrl("file:///android_asset/index.html")
            }

            fun requestScreenCapture() {
                val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_SCREEN_CAPTURE)
            }

            fun hideSystemUI() {
                window.decorView.systemUiVisibility = (
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    or View.SYSTEM_UI_FLAG_FULLSCREEN
                )
            }

            fun showSystemUI() {
                window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
            }

            fun launchTikTok() {
                val packages = listOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")
                var found = false
                for (pkg in packages) {
                    val intent = packageManager.getLaunchIntentForPackage(pkg)
                    if (intent != null) {
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                        startActivity(intent)
                        found = true
                        break
                    }
                }
                if (!found) {
                    Toast.makeText(this, "Aplikasi TikTok tidak ditemukan", Toast.LENGTH_SHORT).show()
                }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)

                if (requestCode == REQUEST_SCREEN_CAPTURE) {
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        val serviceIntent = Intent(this, CaptureService::class.java).apply {
                            action = CaptureService.ACTION_START
                            putExtra(CaptureService.EXTRA_RESULT_CODE, resultCode)
                            putExtra(CaptureService.EXTRA_RESULT_DATA, data)
                        }
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                            startForegroundService(serviceIntent)
                        } else {
                            startService(serviceIntent)
                        }
                        Toast.makeText(this, "Transmisi Virtual Diaktifkan!", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "Izin transmisi dibatalkan", Toast.LENGTH_SHORT).show()
                    }
                }

                if (requestCode == REQUEST_FILE_CHOOSER) {
                    val resultUri = if (resultCode == Activity.RESULT_OK && data != null) {
                        data.data?.let { arrayOf(it) }
                    } else {
                        null
                    }
                    filePathCallback?.onReceiveValue(resultUri)
                    filePathCallback = null
                }
            }

            inner class WebAppInterface(private val activity: MainActivity) {
                @JavascriptInterface
                fun startCapture() {
                    activity.runOnUiThread { activity.requestScreenCapture() }
                }

                @JavascriptInterface
                fun stopCapture() {
                    activity.runOnUiThread {
                        val serviceIntent = Intent(activity, CaptureService::class.java).apply {
                            action = CaptureService.ACTION_STOP
                        }
                        activity.startService(serviceIntent)
                    }
                }

                @JavascriptInterface
                fun enterFullscreen() {
                    activity.runOnUiThread { activity.hideSystemUI() }
                }

                @JavascriptInterface
                fun exitFullscreen() {
                    activity.runOnUiThread { activity.showSystemUI() }
                }

                @JavascriptInterface
                fun shareVideo() {
                    activity.runOnUiThread { activity.launchTikTok() }
                }

                @JavascriptInterface
                fun openTikTok() {
                    activity.runOnUiThread { activity.launchTikTok() }
                }
            }
        }
        EOF

        # 5. Konfigurasi Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.stream.studio'
            compileSdk 34

            defaultConfig {
                applicationId "com.stream.studio"
                minSdk 24
                targetSdk 34
                versionCode 10
                versionName "1.0.9"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-VanacamArchitecture
        path: "app/build/outputs/apk/debug/*.apk"
        
