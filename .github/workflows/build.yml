name: Build StreamStudio VanaCam 1APK Hybrid

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Merge StreamStudio UI with VanaCam Engine
      run: |
        mkdir -p app/src/main/java/com/vanaclone/pro/hook
        mkdir -p app/src/main/java/com/vanaclone/pro/engine
        mkdir -p app/src/main/java/com/vanaclone/pro/ui
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        # Pindahkan file aset Stream Studio ke folder assets APK
        mv -f index.html app/src/main/assets/ 2>/dev/null || true
        mv -f *.html *.js *.css app/src/main/assets/ 2>/dev/null || true

        # 1. Strings
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Stream Studio VanaPro</string>
        </resources>
        EOF

        # 2. AndroidManifest.xml (Proses Virtual + Web Hosting)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

            <application
                android:name="com.vanaclone.pro.VanaApplication"
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:largeHeap="true"
                android:icon="@android:drawable/ic_menu_camera"
                android:label="@string/app_name"
                android:requestLegacyExternalStorage="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                <!-- Tampilan WebView Stream Studio Terpadu -->
                <activity
                    android:name="com.vanaclone.pro.ui.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Sub-proses Virtual Container untuk TikTok -->
                <activity
                    android:name="com.vanaclone.pro.engine.VirtualContainerActivity"
                    android:process=":virtual_process"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:exported="false" />

            </application>
        </manifest>
        EOF

        # 3. VanaCamHook.kt (Pengait Aliran Video Virtual)
        cat << 'EOF' > app/src/main/java/com/vanaclone/pro/hook/VanaCamHook.kt
        package com.vanaclone.pro.hook

        import android.graphics.SurfaceTexture
        import android.media.MediaPlayer
        import android.os.Environment
        import android.util.Log
        import android.view.Surface
        import java.io.File

        object VanaCamHook {
            private const val TAG = "VanaCamHook"
            private var mediaPlayer: MediaPlayer? = null
            val targetVideoFile = File(Environment.getExternalStorageDirectory(), "DCIM/Camera1/virtual.mp4")

            fun init() {
                Log.d(TAG, "VanaCamHook Aktif Menunggu Lensa Kamera")
            }

            fun injectSurface(surface: Surface) {
                try {
                    if (!targetVideoFile.exists()) {
                        Log.e(TAG, "virtual.mp4 tidak ada di DCIM/Camera1/")
                        return
                    }

                    mediaPlayer?.release()
                    mediaPlayer = MediaPlayer().apply {
                        setSurface(surface)
                        setDataSource(targetVideoFile.absolutePath)
                        isLooping = true
                        setOnPreparedListener { start() }
                        prepareAsync()
                    }
                    Log.d(TAG, "Injeksi frame video ke Surface berhasil dijalankan")
                } catch (e: Exception) {
                    Log.e(TAG, "Gagal mengaitkan video: " + e.message)
                }
            }

            fun injectSurfaceTexture(st: SurfaceTexture) {
                injectSurface(Surface(st))
            }
        }
        EOF

        # 4. VanaEngine.kt (Sistem Sandbox Runtime Kloning)
        cat << 'EOF' > app/src/main/java/com/vanaclone/pro/engine/VanaEngine.kt
        package com.vanaclone.pro.engine

        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import com.vanaclone.pro.hook.VanaCamHook

        class VanaEngine private constructor(private val context: Context) {

            companion object {
                @Volatile private var instance: VanaEngine? = null

                fun get(context: Context): VanaEngine {
                    return instance ?: synchronized(this) {
                        instance ?: VanaEngine(context.applicationContext).also { instance = it }
                    }
                }
            }

            fun initEngine() {
                VanaCamHook.init()
            }

            fun launchVirtualClone(): Boolean {
                val packages = listOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")
                var target: String? = null

                for (pkg in packages) {
                    try {
                        context.packageManager.getPackageInfo(pkg, 0)
                        target = pkg
                        break
                    } catch (e: PackageManager.NameNotFoundException) {}
                }

                if (target == null) return false

                val intent = Intent(context, VirtualContainerActivity::class.java).apply {
                    putExtra("TARGET_PACKAGE", target)
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                }
                context.startActivity(intent)
                return true
            }
        }
        EOF

        # 5. VirtualContainerActivity.kt
        cat << 'EOF' > app/src/main/java/com/vanaclone/pro/engine/VirtualContainerActivity.kt
        package com.vanaclone.pro.engine

        import android.os.Bundle
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import com.vanaclone.pro.hook.VanaCamHook

        class VirtualContainerActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val pkg = intent.getStringExtra("TARGET_PACKAGE")
                if (pkg != null) {
                    VanaCamHook.init()
                    val launchIntent = packageManager.getLaunchIntentForPackage(pkg)
                    if (launchIntent != null) {
                        startActivity(launchIntent)
                    } else {
                        Toast.makeText(this, "Target virtual gagal dijalankan", Toast.LENGTH_SHORT).show()
                    }
                }
                finish()
            }
        }
        EOF

        # 6. VanaApplication.kt
        cat << 'EOF' > app/src/main/java/com/vanaclone/pro/VanaApplication.kt
        package com.vanaclone.pro

        import android.app.Application
        import com.vanaclone.pro.engine.VanaEngine

        class VanaApplication : Application() {
            override fun onCreate() {
                super.onCreate()
                VanaEngine.get(this).initEngine()
            }
        }
        EOF

        # 7. MainActivity.kt (Menyatukan Tampilan Web Stream Studio + Jembatan Native VanaCam)
        cat << 'EOF' > app/src/main/java/com/vanaclone/pro/ui/MainActivity.kt
        package com.vanaclone.pro.ui

        import android.app.Activity
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.os.Environment
        import android.view.View
        import android.view.WindowManager
        import android.webkit.JavascriptInterface
        import android.webkit.ValueCallback
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import com.vanaclone.pro.engine.VanaEngine
        import com.vanaclone.pro.hook.VanaCamHook
        import java.io.File
        import java.io.FileOutputStream

        class MainActivity : AppCompatActivity() {

            private lateinit var webView: WebView
            private var filePathCallback: ValueCallback<Array<Uri>>? = null
            private val REQUEST_FILE_CHOOSER = 3001
            private val targetDir = File(Environment.getExternalStorageDirectory(), "DCIM/Camera1")

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                if (!targetDir.exists()) targetDir.mkdirs()

                webView = WebView(this)
                setContentView(webView)

                val settings: WebSettings = webView.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                settings.mediaPlaybackRequiresUserGesture = false
                settings.setRenderPriority(WebSettings.RenderPriority.HIGH)

                webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                webView.webViewClient = WebViewClient()

                webView.webChromeClient = object : WebChromeClient() {
                    override fun onShowFileChooser(
                        view: WebView?,
                        filePathCallback: ValueCallback<Array<Uri>>?,
                        fileChooserParams: FileChooserParams?
                    ): Boolean {
                        this@MainActivity.filePathCallback?.onReceiveValue(null)
                        this@MainActivity.filePathCallback = filePathCallback

                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "video/*"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        try {
                            startActivityForResult(Intent.createChooser(intent, "Pilih Video Live"), REQUEST_FILE_CHOOSER)
                        } catch (e: Exception) {
                            this@MainActivity.filePathCallback = null
                            return false
                        }
                        return true
                    }
                }

                // Jembatan JavaScript untuk index.html Stream Studio
                val bridge = WebAppInterface(this)
                webView.addJavascriptInterface(bridge, "AndroidBridge")
                webView.addJavascriptInterface(bridge, "AndroidApp")

                // Memuat UI Stream Studio lokal
                webView.loadUrl("file:///android_asset/index.html")
            }

            fun processVideoFile(uri: Uri) {
                try {
                    val destFile = VanaCamHook.targetVideoFile
                    contentResolver.openInputStream(uri)?.use { input ->
                        FileOutputStream(destFile).use { output ->
                            input.copyTo(output)
                        }
                    }
                    Toast.makeText(this, "Video disinkronkan ke VanaCamHook (DCIM/Camera1/virtual.mp4)", Toast.LENGTH_SHORT).show()
                } catch (e: Exception) {
                    Toast.makeText(this, "Gagal menyalin video: " + e.message, Toast.LENGTH_SHORT).show()
                }
            }

            fun hideSystemUI() {
                window.decorView.systemUiVisibility = (
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    or View.SYSTEM_UI_FLAG_FULLSCREEN
                )
            }

            fun showSystemUI() {
                window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == REQUEST_FILE_CHOOSER) {
                    val uri = if (resultCode == Activity.RESULT_OK && data != null) data.data else null
                    if (uri != null) {
                        processVideoFile(uri)
                        filePathCallback?.onReceiveValue(arrayOf(uri))
                    } else {
                        filePathCallback?.onReceiveValue(null)
                    }
                    filePathCallback = null
                }
            }

            inner class WebAppInterface(private val activity: MainActivity) {
                @JavascriptInterface
                fun openTikTok() {
                    activity.runOnUiThread {
                        val success = VanaEngine.get(activity).launchVirtualClone()
                        if (!success) {
                            Toast.makeText(activity, "Aplikasi TikTok tidak ditemukan", Toast.LENGTH_SHORT).show()
                        }
                    }
                }

                @JavascriptInterface
                fun shareVideo() {
                    openTikTok()
                }

                @JavascriptInterface
                fun enterFullscreen() {
                    activity.runOnUiThread { activity.hideSystemUI() }
                }

                @JavascriptInterface
                fun exitFullscreen() {
                    activity.runOnUiThread { activity.showSystemUI() }
                }
            }
        }
        EOF

        # 8. Konfigurasi Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudioVanaHybrid"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.vanaclone.pro'
            compileSdk 34

            defaultConfig {
                applicationId "com.vanaclone.pro"
                minSdk 24
                targetSdk 34
                versionCode 25
                versionName "2.6.0"
                ndk {
                    abiFilters "arm64-v8a"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-VanaPro-Hybrid
        path: "app/build/outputs/apk/debug/*.apk"
