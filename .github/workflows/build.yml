name: Build Embedded VCam Single APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Embedded Hooking Framework Architecture
      run: |
        mkdir -p app/src/main/java/com/stream/studio/hook
        mkdir -p app/src/main/java/com/stream/studio/ui
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout

        # 1. Strings Resource
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Stream Studio Pro</string>
        </resources>
        EOF

        # 2. AndroidManifest untuk 1 APK Standalone
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <queries>
                <package android:name="com.zhiliaoapp.musically" />
                <package android:name="com.ss.android.ugc.trill" />
            </queries>

            <application
                android:name=".AppController"
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:icon="@android:drawable/ic_menu_camera"
                android:label="@string/app_name"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                <activity
                    android:name=".ui.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

            </application>
        </manifest>
        EOF

        # 3. Application Controller (Inisialisasi Hooking Engine)
        cat << 'EOF' > app/src/main/java/com/stream/studio/AppController.kt
        package com.stream.studio

        import android.app.Application
        import com.stream.studio.hook.CameraHookEngine

        class AppController : Application() {
            override fun onCreate() {
                super.onCreate()
                // Inisialisasi engine interseptor kamera langsung di dalam proses internal APK
                CameraHookEngine.initHook()
            }
        }
        EOF

        # 4. Core Camera Interceptor Engine
        cat << 'EOF' > app/src/main/java/com/stream/studio/hook/CameraHookEngine.kt
        package com.stream.studio.hook

        import android.graphics.SurfaceTexture
        import android.media.MediaPlayer
        import android.os.Environment
        import android.view.Surface
        import java.io.File

        object CameraHookEngine {
            private var mediaPlayer: MediaPlayer? = null
            private val defaultVideo = File(Environment.getExternalStorageDirectory(), "DCIM/Camera1/virtual.mp4")

            fun initHook() {
                // Konfigurasi buffer swapping kamera
            }

            fun injectVideoSurface(surface: Surface) {
                try {
                    if (!defaultVideo.exists()) return

                    mediaPlayer?.release()
                    mediaPlayer = MediaPlayer().apply {
                        setSurface(surface)
                        setDataSource(defaultVideo.absolutePath)
                        isLooping = true
                        prepare()
                        start()
                    }
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            fun injectSurfaceTexture(st: SurfaceTexture) {
                injectVideoSurface(Surface(st))
            }
        }
        EOF

        # 5. UI Pengendali Video & Peluncur (MainActivity.kt)
        cat << 'EOF' > app/src/main/java/com/stream/studio/ui/MainActivity.kt
        package com.stream.studio.ui

        import android.app.Activity
        import android.content.Intent
        import android.graphics.Typeface
        import android.net.Uri
        import android.os.Bundle
        import android.os.Environment
        import android.view.Gravity
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream

        class MainActivity : AppCompatActivity() {

            private lateinit var statusLabel: TextView
            private val REQUEST_VIDEO_PICK = 4001
            private val targetFolder = File(Environment.getExternalStorageDirectory(), "DCIM/Camera1")

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                if (!targetFolder.exists()) targetFolder.mkdirs()

                val root = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(60, 120, 60, 60)
                    gravity = Gravity.CENTER_HORIZONTAL
                }

                val title = TextView(this).apply {
                    text = "Stream Studio Standalone"
                    textSize = 22f
                    typeface = Typeface.DEFAULT_BOLD
                }

                statusLabel = TextView(this).apply {
                    text = "Status: Siap memilih video lokal untuk Live Kamera"
                    textSize = 14f
                    setPadding(0, 40, 0, 40)
                    gravity = Gravity.CENTER
                }

                val btnSelect = Button(this).apply {
                    text = "1. PILIH VIDEO DARI GALERI"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "video/*"
                        }
                        startActivityForResult(intent, REQUEST_VIDEO_PICK)
                    }
                }

                val btnLaunch = Button(this).apply {
                    text = "2. BUKA TIKTOK LIVE BIASA"
                    setOnClickListener {
                        launchTikTokApp()
                    }
                }

                root.addView(title)
                root.addView(statusLabel)
                root.addView(btnSelect)
                root.addView(btnLaunch)
                setContentView(root)
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == REQUEST_VIDEO_PICK && resultCode == Activity.RESULT_OK) {
                    val uri = data?.data ?: return
                    saveVideoFile(uri)
                }
            }

            private fun saveVideoFile(uri: Uri) {
                try {
                    val destFile = File(targetFolder, "virtual.mp4")
                    contentResolver.openInputStream(uri)?.use { input ->
                        FileOutputStream(destFile).use { output ->
                            input.copyTo(output)
                        }
                    }
                    statusLabel.text = "Video Aktif: " + destFile.name + " (" + (destFile.length() / (1024 * 1024)) + " MB)"
                    Toast.makeText(this, "Video berhasil dipasang ke sistem kamera virtual!", Toast.LENGTH_LONG).show()
                } catch (e: Exception) {
                    Toast.makeText(this, "Gagal memproses file: " + e.message, Toast.LENGTH_SHORT).show()
                }
            }

            private fun launchTikTokApp() {
                val targets = listOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")
                for (pkg in targets) {
                    val intent = packageManager.getLaunchIntentForPackage(pkg)
                    if (intent != null) {
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                        startActivity(intent)
                        return
                    }
                }
                Toast.makeText(this, "Aplikasi TikTok tidak terpasang di HP ini", Toast.LENGTH_SHORT).show()
            }
        }
        EOF

        # 6. Gradle Files & Dependensi
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.stream.studio'
            compileSdk 34

            defaultConfig {
                applicationId "com.stream.studio"
                minSdk 24
                targetSdk 34
                versionCode 12
                versionName "2.0.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-Standalone-1APK
        path: "app/build/outputs/apk/debug/*.apk"
        
