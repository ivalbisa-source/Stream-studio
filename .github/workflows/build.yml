name: Build Virtual Camera APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Virtual Camera Native Hook Engine
      run: |
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/values

        # 1. Strings Resource
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Stream Studio VCam</string>
        </resources>
        EOF

        # 2. Xposed Scope Config
        cat << 'EOF' > app/src/main/assets/xposed_init
        com.stream.studio.HookMain
        EOF

        # 3. AndroidManifest sebagai Modul Kamera Sistem
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:icon="@android:drawable/ic_menu_camera"
                android:supportsRtl="true">

                <meta-data
                    android:name="xposedmodule"
                    android:value="true" />
                <meta-data
                    android:name="xposeddescription"
                    android:value="Virtual Camera Video Hook for TikTok Live" />
                <meta-data
                    android:name="xposedminversion"
                    android:value="89" />
                <meta-data
                    android:name="xposedscope"
                    android:resource="@array/xposedscope" />

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Array Target Scope (TikTok & TikTok Lite)
        cat << 'EOF' > app/src/main/res/values/arrays.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string-array name="xposedscope">
                <item>com.zhiliaoapp.musically</item>
                <item>com.ss.android.ugc.trill</item>
            </string-array>
        </resources>
        EOF

        # 4. Engine Camera Hooking (HookMain.kt)
        cat << 'EOF' > app/src/main/java/com/stream/studio/HookMain.kt
        package com.stream.studio

        import android.graphics.SurfaceTexture
        import android.hardware.Camera
        import android.media.MediaPlayer
        import android.os.Environment
        import android.view.Surface
        import de.robv.android.xposed.IXposedHookLoadPackage
        import de.robv.android.xposed.XC_MethodHook
        import de.robv.android.xposed.XposedBridge
        import de.robv.android.xposed.XposedHelpers
        import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam
        import java.io.File

        class HookMain : IXposedHookLoadPackage {
            private var mediaPlayer: MediaPlayer? = null
            private val videoPath = File(Environment.getExternalStorageDirectory(), "DCIM/Camera1/virtual.mp4")

            override fun handleLoadPackage(lpparam: LoadPackageParam) {
                if (lpparam.packageName != "com.zhiliaoapp.musically" && 
                    lpparam.packageName != "com.ss.android.ugc.trill") return

                XposedBridge.log("VCam StreamStudio active on: " + lpparam.packageName)

                // Hook Legacy Camera Preview
                XposedHelpers.findAndHookMethod(
                    "android.hardware.Camera",
                    lpparam.classLoader,
                    "setPreviewTexture",
                    SurfaceTexture::class.java,
                    object : XC_MethodHook() {
                        override fun beforeHookedMethod(param: MethodHookParam) {
                            val st = param.args[0] as? SurfaceTexture ?: return
                            startPlayback(Surface(st))
                            param.result = null
                        }
                    }
                )

                // Hook Camera2 Session Surface
                XposedHelpers.findAndHookMethod(
                    "android.hardware.camera2.CaptureRequest.Builder",
                    lpparam.classLoader,
                    "addTarget",
                    Surface::class.java,
                    object : XC_MethodHook() {
                        override fun beforeHookedMethod(param: MethodHookParam) {
                            val surface = param.args[0] as? Surface ?: return
                            startPlayback(surface)
                        }
                    }
                )
            }

            private fun startPlayback(surface: Surface) {
                try {
                    if (!videoPath.exists()) {
                        XposedBridge.log("File virtual.mp4 tidak ditemukan di DCIM/Camera1/")
                        return
                    }
                    mediaPlayer?.release()
                    mediaPlayer = MediaPlayer().apply {
                        setSurface(surface)
                        setDataSource(videoPath.absolutePath)
                        isLooping = true
                        prepare()
                        start()
                    }
                } catch (e: Exception) {
                    XposedBridge.log("Error VCam Playback: " + e.message)
                }
            }
        }
        EOF

        # 5. UI Pemilih Video & Penyiap Folder (MainActivity.kt)
        cat << 'EOF' > app/src/main/java/com/stream/studio/MainActivity.kt
        package com.stream.studio

        import android.app.Activity
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.os.Environment
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream

        class MainActivity : AppCompatActivity() {

            private lateinit var statusText: TextView
            private val REQUEST_VIDEO = 2001
            private val targetDir = File(Environment.getExternalStorageDirectory(), "DCIM/Camera1")

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                val layout = android.widget.LinearLayout(this).apply {
                    orientation = android.widget.LinearLayout.VERTICAL
                    setPadding(50, 100, 50, 50)
                }

                val title = TextView(this).apply {
                    text = "Stream Studio VCam Hook"
                    textSize = 22f
                    setTypeface(null, android.graphics.Typeface.BOLD)
                }

                statusText = TextView(this).apply {
                    text = "Status: Pastikan video ditaruh di DCIM/Camera1/virtual.mp4"
                    setPadding(0, 30, 0, 30)
                }

                val btnChoose = Button(this).apply {
                    text = "PILIH VIDEO UNTUK KAMERA TIKTOK"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "video/*"
                        }
                        startActivityForResult(intent, REQUEST_VIDEO)
                    }
                }

                val btnLaunch = Button(this).apply {
                    text = "BUKA TIKTOK LIVE"
                    setOnClickListener {
                        val pkg = "com.zhiliaoapp.musically"
                        val launchIntent = packageManager.getLaunchIntentForPackage(pkg)
                        if (launchIntent != null) {
                            startActivity(launchIntent)
                        } else {
                            Toast.makeText(this@MainActivity, "TikTok belum terpasang", Toast.LENGTH_SHORT).show()
                        }
                    }
                }

                layout.addView(title)
                layout.addView(statusText)
                layout.addView(btnChoose)
                layout.addView(btnLaunch)
                setContentView(layout)

                if (!targetDir.exists()) targetDir.mkdirs()
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == REQUEST_VIDEO && resultCode == Activity.RESULT_OK) {
                    val uri = data?.data ?: return
                    copyVideoToVirtual(uri)
                }
            }

            private fun copyVideoToVirtual(uri: Uri) {
                try {
                    val destFile = File(targetDir, "virtual.mp4")
                    contentResolver.openInputStream(uri)?.use { input ->
                        FileOutputStream(destFile).use { output ->
                            input.copyTo(output)
                        }
                    }
                    statusText.text = "Video Siap: " + destFile.absolutePath
                    Toast.makeText(this, "Video berhasil dipasang ke Kamera Virtual!", Toast.LENGTH_LONG).show()
                } catch (e: Exception) {
                    Toast.makeText(this, "Gagal menyalin video: " + e.message, Toast.LENGTH_SHORT).show()
                }
            }
        }
        EOF

        # 6. Gradle Files dengan Dependensi Xposed API
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
                maven { url 'https://api.xposed.info/' }
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.stream.studio'
            compileSdk 34

            defaultConfig {
                applicationId "com.stream.studio"
                minSdk 24
                targetSdk 34
                versionCode 7
                versionName "1.0.6"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            compileOnly 'de.robv.android.xposed:api:82'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-VCam-App
        path: "app/build/outputs/apk/debug/*.apk"
