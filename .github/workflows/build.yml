name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Project Files & Complete Native Android Implementation
      run: |
        # 1. Folder structure
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/assets

        # Pindahkan aset web jika ada di luar
        mv -f index.html app/src/main/assets/ 2>/dev/null || true
        mv -f *.html *.js *.css app/src/main/assets/ 2>/dev/null || true

        # 2. FileProvider config
        cat << 'EOF' > app/src/main/res/xml/file_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-path name="external_files" path="."/>
            <cache-path name="cache_files" path="."/>
        </paths>
        EOF

        # 3. AndroidManifest.xml lengkap
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <queries>
                <package android:name="com.zhiliaoapp.musically" />
                <package android:name="com.ss.android.ugc.trill" />
            </queries>

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="StreamStudio"
                android:roundIcon="@android:drawable/sym_def_app_icon"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="com.stream.studio.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/file_paths" />
                </provider>

            </application>
        </manifest>
        EOF

        # 4. MainActivity.kt (Dukungan Galeri, MediaProjection Dialog, & Share TikTok Native)
        cat << 'EOF' > app/src/main/java/com/stream/studio/MainActivity.kt
        package com.stream.studio

        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.media.projection.MediaProjectionManager
        import android.net.Uri
        import android.os.Bundle
        import android.webkit.JavascriptInterface
        import android.webkit.ValueCallback
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {

            private lateinit var webView: WebView
            private var filePathCallback: ValueCallback<Array<Uri>>? = null
            private val REQUEST_SCREEN_CAPTURE = 1001
            private val REQUEST_FILE_CHOOSER = 1002

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                webView = WebView(this)
                setContentView(webView)

                val settings: WebSettings = webView.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                settings.mediaPlaybackRequiresUserGesture = false

                webView.webViewClient = WebViewClient()

                // WebChromeClient untuk membuka Galeri Android secara otomatis
                webView.webChromeClient = object : WebChromeClient() {
                    override fun onShowFileChooser(
                        view: WebView?,
                        filePathCallback: ValueCallback<Array<Uri>>?,
                        fileChooserParams: FileChooserParams?
                    ): Boolean {
                        this@MainActivity.filePathCallback?.onReceiveValue(null)
                        this@MainActivity.filePathCallback = filePathCallback

                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "*/*"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        try {
                            startActivityForResult(Intent.createChooser(intent, "Pilih Media"), REQUEST_FILE_CHOOSER)
                        } catch (e: Exception) {
                            this@MainActivity.filePathCallback = null
                            return false
                        }
                        return true
                    }
                }

                // Bridge untuk JavaScript di index.html
                val bridge = WebAppInterface(this)
                webView.addJavascriptInterface(bridge, "AndroidBridge")
                webView.addJavascriptInterface(bridge, "AndroidApp")

                webView.loadUrl("file:///android_asset/index.html")
            }

            fun requestScreenCapture() {
                val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_SCREEN_CAPTURE)
            }

            fun shareToTikTokDirectly() {
                val shareIntent = Intent(Intent.ACTION_SEND).apply {
                    type = "video/*"
                    `package` = "com.zhiliaoapp.musically"
                }
                try {
                    startActivity(shareIntent)
                } catch (e: Exception) {
                    val fallback = Intent(Intent.ACTION_SEND).apply {
                        type = "video/*"
                    }
                    startActivity(Intent.createChooser(fallback, "Bagikan ke TikTok"))
                }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)

                // Respons Dialog MediaProjection
                if (requestCode == REQUEST_SCREEN_CAPTURE) {
                    if (resultCode == Activity.RESULT_OK) {
                        Toast.makeText(this, "Transmisi Virtual Diaktifkan!", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "Izin transmisi dibatalkan", Toast.LENGTH_SHORT).show()
                    }
                }

                // Respons Pemilihan File Galeri
                if (requestCode == REQUEST_FILE_CHOOSER) {
                    val resultUri = if (resultCode == Activity.RESULT_OK && data != null) {
                        data.data?.let { arrayOf(it) }
                    } else {
                        null
                    }
                    filePathCallback?.onReceiveValue(resultUri)
                    filePathCallback = null
                }
            }

            inner class WebAppInterface(private val activity: MainActivity) {
                @JavascriptInterface
                fun startCapture() {
                    activity.runOnUiThread {
                        activity.requestScreenCapture()
                    }
                }

                @JavascriptInterface
                fun shareVideo() {
                    activity.runOnUiThread {
                        activity.shareToTikTokDirectly()
                    }
                }
            }
        }
        EOF

        # 5. Konfigurasi Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "StreamStudio"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.stream.studio'
            compileSdk 34

            defaultConfig {
                applicationId "com.stream.studio"
                minSdk 24
                targetSdk 34
                versionCode 4
                versionName "1.0.3"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StreamStudio-App
        path: "app/build/outputs/apk/debug/*.apk"
        
