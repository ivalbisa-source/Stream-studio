name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Project and Folder Structure
      run: |
        # Buat susunan folder resmi
        mkdir -p app/src/main/java/com/stream/studio
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Pisahkan file build.gradle modul app jika belum di dalam app/
        if [ ! -f "app/build.gradle" ]; then
          # Cari file build.gradle yang berisi com.android.application
          for f in $(grep -l "com.android.application" *.gradle 2>/dev/null); do
            mv "$f" app/build.gradle
            break
          done
        fi

        # Pindahkan file resource dan kode
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f *.kt *.java app/src/main/java/com/stream/studio/ 2>/dev/null || true
        mv -f *activity*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv -f themes.xml strings.xml colors.xml app/src/main/res/values/ 2>/dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Android APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: StreamStudio-App
        path: "**/build/outputs/apk/debug/*.apk"
